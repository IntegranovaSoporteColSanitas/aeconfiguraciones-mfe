server {
    listen       8080;
    server_name  localhost;
    server_tokens off;

    location / {

        if ($request_method = 'OPTIONS') {  
            add_header Content-Security-Policy "object-src 'none'; frame-ancestors 'none'; base-uri 'self';" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
			add_header 'Cross-Origin-Embedder-Policy' 'unsafe-none';
			add_header 'Cross-Origin-Resource-Policy' 'cross-origin';
			add_header 'Cross-Origin-Opener-Policy' 'unsafe-none';
			add_header 'Permissions-Policy' 'geolocation=*';

            return 204;
        }
        if ($request_method = 'GET') {
            add_header Content-Security-Policy "object-src 'none'; frame-ancestors 'none'; base-uri 'self';" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
            add_header Pragma "no-cache";
            add_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0";        
			add_header 'Cross-Origin-Embedder-Policy' 'unsafe-none';
			add_header 'Cross-Origin-Resource-Policy' 'cross-origin';
			add_header 'Cross-Origin-Opener-Policy' 'unsafe-none';
			add_header 'Permissions-Policy' 'geolocation=*';
		}
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

	error_page 401 402 403 404 405 406 407 408 409 410 411 
			   412 413 414 415 416 417 418 421 422 423 424
			   425 426 428 431 451 @error4XX;
	location @error4XX {
            default_type text/html;
            return 200 '<html><head><title>Aviso</title></head><body><center><h1>Se ha producido un error. Contacte con el administrador</h1></center><br><center><h1>$status</h1></center></body></html>';
    }
}
