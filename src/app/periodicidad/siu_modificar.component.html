<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="puthisPeriodicidad" *ngIf="puthisPeriodicidad.visible"
                (selected)="processputhisperiodicidadSelected($event)" (cleared)="cleanputhisperiodicidad()"
                (keypressLenseSearch)="onKeypressLenseSearch('onputhisperiodicidadChange')"
                (searched)="doSearchAction('puthisPeriodicidad')"></imes-lensesearch>
            <imes-input-radio [field]="puEsMensual" *ngIf="puEsMensual.visible"></imes-input-radio>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
