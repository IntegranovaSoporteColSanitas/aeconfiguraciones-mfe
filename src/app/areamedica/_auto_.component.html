<form novalidate>
    <ng-container *ngIf="visible">
        <h3 class="title">{{title}}</h3>
        <div class="iiuRegion" [ngClass]="cssClasses">
            <imes-actionsnavigations [queryIU]="this"></imes-actionsnavigations>
            <!-- Display Set elements -->
            <div class="card displaySet">
                <div class="card-header">{{title}}</div>
                <div class="card-body">
                    <imes-input-string [field]="dseUsuario" *ngIf="dseUsuario.visible"></imes-input-string>
                    <imes-input-string [field]="dsePrimerNombre" *ngIf="dsePrimerNombre.visible"></imes-input-string>
                    <imes-input-string [field]="dseSegundoNombre" *ngIf="dseSegundoNombre.visible"></imes-input-string>
                    <imes-input-string [field]="dsePrimerApellido" *ngIf="dsePrimerApellido.visible"></imes-input-string>
                    <imes-input-string [field]="dseSegundoApellido" *ngIf="dseSegundoApellido.visible"></imes-input-string>
                    <imes-input-string [field]="dsedrvNombreCompleto" *ngIf="dsedrvNombreCompleto.visible"></imes-input-string>
                    <imes-input-string [field]="dseUsuarioLDAP" *ngIf="dseUsuarioLDAP.visible"></imes-input-string>
                    <imes-input-string [field]="dseEmail" *ngIf="dseEmail.visible"></imes-input-string>
                    <imes-input-string [field]="dseCodJefe" *ngIf="dseCodJefe.visible"></imes-input-string>
                    <imes-input-numeric [field]="dseId" *ngIf="dseId.visible"></imes-input-numeric>
                    <imes-input-definedselection [field]="dseManual" *ngIf="dseManual.visible"></imes-input-definedselection>
                    <imes-input-string [field]="dsedrvNomJefe" *ngIf="dsedrvNomJefe.visible"></imes-input-string>
                    <imes-input-string [field]="dsedrvNomAgencia" *ngIf="dsedrvNomAgencia.visible"></imes-input-string>
                    <imes-input-definedselection [field]="dseDisponible" *ngIf="dseDisponible.visible"></imes-input-definedselection>
                    <imes-input-numeric [field]="dseNumSolNoTerminadas" *ngIf="dseNumSolNoTerminadas.visible"></imes-input-numeric>
                    <imes-input-definedselection [field]="dsedrvEsAsesorIntegral" *ngIf="dsedrvEsAsesorIntegral.visible"></imes-input-definedselection>
                    <imes-input-definedselection [field]="dsedrvEsAfiliacion" *ngIf="dsedrvEsAfiliacion.visible"></imes-input-definedselection>
                </div>
            </div>
            <div *ngIf="showInstanceLog" class="iiuLogNavigation">
                <a (click)="onNavigateLoginstance()">{{langMng.translateText('app_INSTANCELOG', 'Log Instance')}}</a>
            </div>
        </div>
        <div class="col-xs-12 col-sm-12 col-md-12 iiuButtons">
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_CLOSE', '')}}</button>
        </div>
    </ng-container>
</form>
