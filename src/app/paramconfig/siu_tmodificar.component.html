<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="puthisParamConfig" *ngIf="puthisParamConfig.visible"
                (selected)="processputhisparamconfigSelected($event)" (cleared)="cleanputhisparamconfig()"
                (keypressLenseSearch)="onKeypressLenseSearch('onputhisparamconfigChange')"
                (searched)="doSearchAction('puthisParamConfig')"></imes-lensesearch>
            <imes-input-string [field]="ptupuValor" *ngIf="ptupuValor.visible"></imes-input-string>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
