<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-input-string [field]="puatrCodigo" *ngIf="puatrCodigo.visible"></imes-input-string>
            <imes-input-string [field]="puatrNombre" *ngIf="puatrNombre.visible"></imes-input-string>
            <imes-input-string [field]="puatrNumIdentificacion" *ngIf="puatrNumIdentificacion.visible"></imes-input-string>
            <imes-input-radio [field]="puatrParaMaternidad" *ngIf="puatrParaMaternidad.visible"></imes-input-radio>
            <imes-input-radio [field]="puatrParaNeonatal" *ngIf="puatrParaNeonatal.visible"></imes-input-radio>
            <imes-input-date [field]="puatrFechaInicial" *ngIf="puatrFechaInicial.visible"></imes-input-date>
            <imes-input-date [field]="puatrFechaFinal" *ngIf="puatrFechaFinal.visible"></imes-input-date>
            <imes-lensesearch [field]="puagrTarifa" *ngIf="puagrTarifa.visible"
                (selected)="processpuagrtarifaSelected($event)" (cleared)="cleanpuagrtarifa()"
                (keypressLenseSearch)="onKeypressLenseSearch('onpuagrtarifaChange')"
                (searched)="doSearchAction('puagrTarifa')"></imes-lensesearch>
            <imes-preload [field]="puagrTipoIdentificacion" *ngIf="puagrTipoIdentificacion.visible"></imes-preload>
            <imes-lensesearch [field]="puagrMunicipio" *ngIf="puagrMunicipio.visible"
                (selected)="processpuagrmunicipioSelected($event)" (cleared)="cleanpuagrmunicipio()"
                (keypressLenseSearch)="onKeypressLenseSearch('onpuagrmunicipioChange')"
                (searched)="doSearchAction('puagrMunicipio')"></imes-lensesearch>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
