<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="puthisEstadoPersona" *ngIf="puthisEstadoPersona.visible"
                (selected)="processputhisestadopersonaSelected($event)" (cleared)="cleanputhisestadopersona()"
                (keypressLenseSearch)="onKeypressLenseSearch('onputhisestadopersonaChange')"
                (searched)="doSearchAction('puthisEstadoPersona')"></imes-lensesearch>
            <imes-input-radio [field]="puUnBeneficiarioDistino" *ngIf="puUnBeneficiarioDistino.visible"></imes-input-radio>
            <imes-input-radio [field]="puProhibidoBeneficiarios" *ngIf="puProhibidoBeneficiarios.visible"></imes-input-radio>
            <imes-input-radio [field]="puProhibidoContratante" *ngIf="puProhibidoContratante.visible"></imes-input-radio>
            <imes-input-radio [field]="puProhibidoTitular" *ngIf="puProhibidoTitular.visible"></imes-input-radio>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
