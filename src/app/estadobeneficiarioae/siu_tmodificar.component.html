<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="puthisEstadoBeneficiarioAE" *ngIf="puthisEstadoBeneficiarioAE.visible"
                (selected)="processputhisestadobeneficiarioaeSelected($event)" (cleared)="cleanputhisestadobeneficiarioae()"
                (keypressLenseSearch)="onKeypressLenseSearch('onputhisestadobeneficiarioaeChange')"
                (searched)="doSearchAction('puthisEstadoBeneficiarioAE')"></imes-lensesearch>
            <imes-input-string [field]="ptupuDescripcion" *ngIf="ptupuDescripcion.visible"></imes-input-string>
            <imes-preload [field]="ptupuevcEstadoBeneficiario" *ngIf="ptupuevcEstadoBeneficiario.visible"></imes-preload>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
