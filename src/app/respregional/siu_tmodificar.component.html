<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="puthisRespRegional" *ngIf="puthisRespRegional.visible"
                (selected)="processputhisrespregionalSelected($event)" (cleared)="cleanputhisrespregional()"
                (keypressLenseSearch)="onKeypressLenseSearch('onputhisrespregionalChange')"
                (searched)="doSearchAction('puthisRespRegional')"></imes-lensesearch>
            <imes-input-string [field]="ptupuUsuarioLDAP" *ngIf="ptupuUsuarioLDAP.visible"></imes-input-string>
            <imes-input-string [field]="ptupuPrimerNombre" *ngIf="ptupuPrimerNombre.visible"></imes-input-string>
            <imes-input-string [field]="ptupuSegundoNombre" *ngIf="ptupuSegundoNombre.visible"></imes-input-string>
            <imes-input-string [field]="ptupuPrimerApellido" *ngIf="ptupuPrimerApellido.visible"></imes-input-string>
            <imes-input-string [field]="ptupuSegundoApellido" *ngIf="ptupuSegundoApellido.visible"></imes-input-string>
            <imes-input-string [field]="ptupuEmail" *ngIf="ptupuEmail.visible"></imes-input-string>
            <imes-preload [field]="ptupuevcRegional" *ngIf="ptupuevcRegional.visible"></imes-preload>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
