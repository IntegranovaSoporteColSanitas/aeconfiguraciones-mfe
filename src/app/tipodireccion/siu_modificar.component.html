<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="puthisTipoDireccion" *ngIf="puthisTipoDireccion.visible"
                (selected)="processputhistipodireccionSelected($event)" (cleared)="cleanputhistipodireccion()"
                (keypressLenseSearch)="onKeypressLenseSearch('onputhistipodireccionChange')"
                (searched)="doSearchAction('puthisTipoDireccion')"></imes-lensesearch>
            <imes-input-radio [field]="puEsResidencia" *ngIf="puEsResidencia.visible"></imes-input-radio>
            <imes-input-radio [field]="puEsCorrespondencia" *ngIf="puEsCorrespondencia.visible"></imes-input-radio>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
