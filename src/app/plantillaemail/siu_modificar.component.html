<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="puthisPlantillasEmail" *ngIf="puthisPlantillasEmail.visible"
                (selected)="processputhisplantillasemailSelected($event)" (cleared)="cleanputhisplantillasemail()"
                (keypressLenseSearch)="onKeypressLenseSearch('onputhisplantillasemailChange')"
                (searched)="doSearchAction('puthisPlantillasEmail')"></imes-lensesearch>
            <imes-input-string [field]="puAsunto" *ngIf="puAsunto.visible"></imes-input-string>
            <imes-rich-editor [field]="puTextoMensaje" *ngIf="puTextoMensaje.visible"></imes-rich-editor>
            <imes-input-string [field]="puEmailConf" *ngIf="puEmailConf.visible"></imes-input-string>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
