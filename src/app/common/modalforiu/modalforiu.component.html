<p-dialog header="" [(visible)]="visible" [modal]="true" (onHide)="cancel()" [blockScroll]="true" position="top"
    [style]="{'padding-top': '60px'}"
    [draggable]="true" [closeOnEscape]="true" [closable]="true" [resizable]="false"
    styleClass="col-12 col-sm-11 col-md-11 modalForIU"
    [contentStyle]="{'max-height':'500px', 'display': 'flow-root'}" >
    <p-header>{{title}}</p-header>

    <genericsiu *ngIf="selector=='genericsiu'"></genericsiu>

    <imes-rol-siu-crear *ngIf="selector=='imes-rol-siu-crear'"></imes-rol-siu-crear>
    <imes-prorrateo-siu-crear *ngIf="selector=='imes-prorrateo-siu-crear'"></imes-prorrateo-siu-crear>
    <imes-prorrateo-siu-modificar *ngIf="selector=='imes-prorrateo-siu-modificar'"></imes-prorrateo-siu-modificar>
    <imes-tipofactura-siu-crear *ngIf="selector=='imes-tipofactura-siu-crear'"></imes-tipofactura-siu-crear>
    <imes-tipofactura-siu-modificar *ngIf="selector=='imes-tipofactura-siu-modificar'"></imes-tipofactura-siu-modificar>
    <imes-gs-siu-tgaddplantrep *ngIf="selector=='imes-gs-siu-tgaddplantrep'"></imes-gs-siu-tgaddplantrep>
    <imes-gs-siu-tgeditplantrep *ngIf="selector=='imes-gs-siu-tgeditplantrep'"></imes-gs-siu-tgeditplantrep>

</p-dialog>
