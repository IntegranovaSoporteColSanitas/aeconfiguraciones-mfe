<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-preload [field]="ptupuagrTipoNovedad" *ngIf="ptupuagrTipoNovedad.visible" (selected)="onptupuagrtiponovedadChange()"></imes-preload>
            <imes-input-definedselection [field]="ptAliasParaContrato" *ngIf="ptAliasParaContrato.visible" (valueChanged)="onptaliasparacontratoChange()"></imes-input-definedselection>
            <imes-input-definedselection [field]="ptAliasParaTitular" *ngIf="ptAliasParaTitular.visible" (valueChanged)="onptaliasparatitularChange()"></imes-input-definedselection>
            <imes-input-definedselection [field]="ptAliasParaUsuario" *ngIf="ptAliasParaUsuario.visible" (valueChanged)="onptaliasparausuarioChange()"></imes-input-definedselection>
            <imes-input-string [field]="ptAlias" *ngIf="ptAlias.visible"></imes-input-string>
            <imes-input-string [field]="ptupuatrNombre" *ngIf="ptupuatrNombre.visible"></imes-input-string>
            <imes-input-string [field]="ptupuatrDescripcion" *ngIf="ptupuatrDescripcion.visible"></imes-input-string>
            <imes-input-string [field]="ptupuatrCodigoLegal" *ngIf="ptupuatrCodigoLegal.visible"></imes-input-string>
            <imes-input-radio [field]="ptupuatrReqDocPersona" *ngIf="ptupuatrReqDocPersona.visible"></imes-input-radio>
            <imes-input-radio [field]="ptupuatrReqDocSolicitud" *ngIf="ptupuatrReqDocSolicitud.visible"></imes-input-radio>
            <imes-input-radio [field]="ptupuatrVariasFamilias" *ngIf="ptupuatrVariasFamilias.visible"></imes-input-radio>
            <imes-input-numeric [field]="ptupuatrMinValorMeses" *ngIf="ptupuatrMinValorMeses.visible"></imes-input-numeric>
            <imes-input-numeric [field]="ptupuatrMaxValorMeses" *ngIf="ptupuatrMaxValorMeses.visible"></imes-input-numeric>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
