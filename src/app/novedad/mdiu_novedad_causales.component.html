<form novalidate>
    <ng-container *ngIf="visible">
        <h3 class="title">{{title}}</h3>

        <div class="master" [ngClass]="cssClasses">
            <h3 class="title">{{master.title}}</h3>
            <div class="iiuRegion" [ngClass]="master.cssClasses">
                <imes-actionsnavigations [queryIU]="master"></imes-actionsnavigations>
                <!-- Display Set elements -->
                <div class="card displaySet">
                    <div class="card-header">{{master.title}}</div>
                    <div class="card-body">
                        <imes-input-string [field]="master.dseTipoNovedadNombre" *ngIf="master.dseTipoNovedadNombre.visible"></imes-input-string>
                        <imes-input-string [field]="master.dseNombre" *ngIf="master.dseNombre.visible"></imes-input-string>
                        <imes-input-string [field]="master.dseAliasNovedad" *ngIf="master.dseAliasNovedad.visible"></imes-input-string>
                        <imes-input-string [field]="master.dseDescripcion" *ngIf="master.dseDescripcion.visible"></imes-input-string>
                        <imes-input-string [field]="master.dseCodigoLegal" *ngIf="master.dseCodigoLegal.visible"></imes-input-string>
                        <imes-input-radio [field]="master.dseReqDocPersona" *ngIf="master.dseReqDocPersona.visible"></imes-input-radio>
                        <imes-input-radio [field]="master.dseReqDocSolicitud" *ngIf="master.dseReqDocSolicitud.visible"></imes-input-radio>
                        <imes-input-radio [field]="master.dseVariasFamilias" *ngIf="master.dseVariasFamilias.visible"></imes-input-radio>
                        <imes-input-numeric [field]="master.dseMinValorMeses" *ngIf="master.dseMinValorMeses.visible"></imes-input-numeric>
                        <imes-input-numeric [field]="master.dseMaxValorMeses" *ngIf="master.dseMaxValorMeses.visible"></imes-input-numeric>
                    </div>
                </div>
                <div *ngIf="master.showInstanceLog" class="iiuLogNavigation">
                    <a (click)="master.onNavigateLoginstance()">{{master.langMng.translateText('app_INSTANCELOG', 'Log Instance')}}</a>
                </div>
            </div>
        </div>
        <fieldset class="col-12 details"  [ngClass]="cssClasses" [disabled]="!enableDetails" *ngIf="d0Visible || d1Visible">
            <legend *ngIf="false">Details legend</legend>
            <ul class="nav nav-tabs" role="tablist">
                <li class="nav-item" *ngIf="d0Visible">
                    <a (click)="setActiveDetail(0)" class="nav-link"
                            [ngClass]="{'active': activeDetail == 0}" role="tab" tabindex
                            data-bs-toggle="tab">{{d0.title}}</a>
                </li>
                <li class="nav-item" *ngIf="d1Visible">
                    <a (click)="setActiveDetail(1)" class="nav-link"
                            [ngClass]="{'active': activeDetail == 1}" role="tab" tabindex
                            data-bs-toggle="tab">{{d1.title}}</a>
                </li>
            </ul>
            <div class="tab-content detailsContent">
                <div class="tab-pane" [ngClass]=" {'active': activeDetail == 0}" *ngIf="d0Visible" role="tabpanel">
                        <h3 class="title">{{d0.title}}</h3>
                        <div class="piuRegion" [ngClass]="d0.cssClasses">
                            <imes-actionsnavigations [queryIU]="d0"></imes-actionsnavigations>
                            <imes-grid [piu]="d0"></imes-grid>
                        </div>
                </div>
                <div class="tab-pane" [ngClass]=" {'active': activeDetail == 1}" *ngIf="d1Visible" role="tabpanel">
                        <h3 class="title">{{d1.title}}</h3>
                        <div class="piuRegion" [ngClass]="d1.cssClasses">
                            <imes-actionsnavigations [queryIU]="d1"></imes-actionsnavigations>
                            <imes-grid [piu]="d1"></imes-grid>
                        </div>
                </div>
            </div>
        </fieldset>
        <div class="col-12 mdiuButtons">
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_CLOSE', '')}}</button>
        </div>
    </ng-container>
</form>
