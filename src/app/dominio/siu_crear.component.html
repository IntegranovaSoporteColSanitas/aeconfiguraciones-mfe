<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-preload [field]="puagrProductoT" *ngIf="puagrProductoT.visible" (selected)="onpuagrproductotChange()"></imes-preload>
            <imes-preload [field]="puagrPlanT" *ngIf="puagrPlanT.visible"></imes-preload>
            <imes-input-radio [field]="puatrReqCuesMed" *ngIf="puatrReqCuesMed.visible"></imes-input-radio>
            <imes-input-radio [field]="puatrNoCuesMedTras" *ngIf="puatrNoCuesMedTras.visible"></imes-input-radio>
            <imes-input-radio [field]="puatrNuevaAfiliacion" *ngIf="puatrNuevaAfiliacion.visible"></imes-input-radio>
            <div class="card argumentGroup" *ngIf="isGroupVisible('5')">
                <div class="card-header">{{getGroupAlias('5')}}</div>
                <div class="card-body">
                    <imes-input-radio [field]="puatrInclusion" *ngIf="puatrInclusion.visible" (valueChanged)="onpuatrinclusionChange()"></imes-input-radio>
                    <imes-input-radio [field]="puatrInclusionModGrupoAsoc" *ngIf="puatrInclusionModGrupoAsoc.visible"></imes-input-radio>
                </div>
            </div>
            <imes-input-radio [field]="puatrAcepPolizaInter" *ngIf="puatrAcepPolizaInter.visible"></imes-input-radio>
            <imes-input-radio [field]="puatrPermiteRechazadosAfi" *ngIf="puatrPermiteRechazadosAfi.visible"></imes-input-radio>
            <imes-input-radio [field]="puatrProrrateoUsuExistente" *ngIf="puatrProrrateoUsuExistente.visible"></imes-input-radio>
            <imes-input-radio [field]="puatrAcepCuesMat" *ngIf="puatrAcepCuesMat.visible"></imes-input-radio>
            <imes-input-radio [field]="puatrAcepCuesNeo" *ngIf="puatrAcepCuesNeo.visible"></imes-input-radio>
            <imes-input-radio [field]="puatrAcepBBGestante" *ngIf="puatrAcepBBGestante.visible"></imes-input-radio>
            <imes-input-radio [field]="puatrIgnorarPreexistencias" *ngIf="puatrIgnorarPreexistencias.visible"></imes-input-radio>
            <imes-input-radio [field]="puatrMostrarPreexContrato" *ngIf="puatrMostrarPreexContrato.visible"></imes-input-radio>
            <imes-input-radio [field]="puatrMostrarPreexAnexos" *ngIf="puatrMostrarPreexAnexos.visible"></imes-input-radio>
            <div class="card argumentGroup" *ngIf="isGroupVisible('15')">
                <div class="card-header">{{getGroupAlias('15')}}</div>
                <div class="card-body">
                    <imes-input-radio [field]="puatrNovExcepcionReqDoc" *ngIf="puatrNovExcepcionReqDoc.visible"></imes-input-radio>
                    <div class="card argumentGroup" *ngIf="isGroupVisible('15_1')">
                        <div class="card-header">{{getGroupAlias('15_1')}}</div>
                        <div class="card-body">
                            <imes-input-string [field]="puatrSolNovColorOscuro" *ngIf="puatrSolNovColorOscuro.visible"></imes-input-string>
                            <imes-input-string [field]="puatrSolNovColorClaro" *ngIf="puatrSolNovColorClaro.visible"></imes-input-string>
                            <imes-input-string [field]="puatrSolNovLogo" *ngIf="puatrSolNovLogo.visible"></imes-input-string>
                        </div>
                    </div>
                </div>
            </div>
            <imes-lensesearch [field]="puagrGrupoAsesores" *ngIf="puagrGrupoAsesores.visible"
                (selected)="processpuagrgrupoasesoresSelected($event)" (cleared)="cleanpuagrgrupoasesores()"
                (keypressLenseSearch)="onKeypressLenseSearch('onpuagrgrupoasesoresChange')"
                (searched)="doSearchAction('puagrGrupoAsesores')"></imes-lensesearch>
            <imes-lensesearch [field]="puagrGrupoAreaMedica" *ngIf="puagrGrupoAreaMedica.visible"
                (selected)="processpuagrgrupoareamedicaSelected($event)" (cleared)="cleanpuagrgrupoareamedica()"
                (keypressLenseSearch)="onKeypressLenseSearch('onpuagrgrupoareamedicaChange')"
                (searched)="doSearchAction('puagrGrupoAreaMedica')"></imes-lensesearch>
            <imes-input-radio [field]="puatrTramiteEnLinea" *ngIf="puatrTramiteEnLinea.visible"></imes-input-radio>
            <imes-input-radio [field]="puatrVigenciaRadicacion" *ngIf="puatrVigenciaRadicacion.visible"></imes-input-radio>
        </div>
        <div class="col-xs-12 col-sm-12 col-md-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
