<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="puthisDominio" *ngIf="puthisDominio.visible"
                (selected)="processputhisdominioSelected($event)" (cleared)="cleanputhisdominio()"
                (keypressLenseSearch)="onKeypressLenseSearch('onputhisdominioChange')"
                (searched)="doSearchAction('puthisDominio')"></imes-lensesearch>
            <imes-lensesearch [field]="ptupuagrPlantillaReporte" *ngIf="ptupuagrPlantillaReporte.visible"
                (selected)="processptupuagrplantillareporteSelected($event)" (cleared)="cleanptupuagrplantillareporte()"
                (keypressLenseSearch)="onKeypressLenseSearch('onptupuagrplantillareporteChange')"
                (searched)="doSearchAction('ptupuagrPlantillaReporte')"></imes-lensesearch>
            <imes-input-radio [field]="ptupuatrEnviarAuto" *ngIf="ptupuatrEnviarAuto.visible"></imes-input-radio>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
