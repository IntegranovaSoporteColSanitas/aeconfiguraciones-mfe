<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-input-numeric [field]="puatrDia" *ngIf="puatrDia.visible"></imes-input-numeric>
            <imes-input-numeric [field]="puatrPorcentaje" *ngIf="puatrPorcentaje.visible"></imes-input-numeric>
            <imes-lensesearch [field]="puagrDominio" *ngIf="puagrDominio.visible"
                (selected)="processpuagrdominioSelected($event)" (cleared)="cleanpuagrdominio()"
                (keypressLenseSearch)="onKeypressLenseSearch('onpuagrdominioChange')"
                (searched)="doSearchAction('puagrDominio')"></imes-lensesearch>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
