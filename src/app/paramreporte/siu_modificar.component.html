<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lense [field]="puthisParamReporte" *ngIf="puthisParamReporte.visible" (selected)="onputhisparamreporteChange()"
                (cleared)="cleanputhisparamreporte()" (searched)="doSearchAction('puthisParamReporte')"></imes-lense>
            <imes-input-string [field]="puTitulo" *ngIf="puTitulo.visible"></imes-input-string>
            <imes-input-string [field]="puDescripcion" *ngIf="puDescripcion.visible"></imes-input-string>
            <imes-input-radio [field]="puEsNumerico" *ngIf="puEsNumerico.visible"></imes-input-radio>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
