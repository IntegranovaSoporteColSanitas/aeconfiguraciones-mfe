<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lense [field]="puthisParentescoDom" *ngIf="puthisParentescoDom.visible" (selected)="onputhisparentescodomChange()"
                (cleared)="cleanputhisparentescodom()" (searched)="doSearchAction('puthisParentescoDom')"></imes-lense>
            <imes-input-numeric [field]="puEdadMinimaA" *ngIf="puEdadMinimaA.visible"></imes-input-numeric>
            <imes-input-numeric [field]="puEdadMaximaA" *ngIf="puEdadMaximaA.visible"></imes-input-numeric>
            <imes-input-numeric [field]="puEdadMinimaD" *ngIf="puEdadMinimaD.visible"></imes-input-numeric>
            <imes-input-numeric [field]="puEdadMaximaP" *ngIf="puEdadMaximaP.visible"></imes-input-numeric>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
