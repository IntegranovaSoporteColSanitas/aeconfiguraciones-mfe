<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-input-numeric [field]="puatrEdadMinimaA" *ngIf="puatrEdadMinimaA.visible"></imes-input-numeric>
            <imes-input-numeric [field]="puatrEdadMaximaA" *ngIf="puatrEdadMaximaA.visible"></imes-input-numeric>
            <imes-input-numeric [field]="puatrEdadMinimaD" *ngIf="puatrEdadMinimaD.visible"></imes-input-numeric>
            <imes-input-numeric [field]="puatrEdadMaximaP" *ngIf="puatrEdadMaximaP.visible"></imes-input-numeric>
            <imes-preload [field]="puagrParentesco" *ngIf="puagrParentesco.visible"></imes-preload>
            <imes-lensesearch [field]="puagrDominio" *ngIf="puagrDominio.visible"
                (selected)="processpuagrdominioSelected($event)" (cleared)="cleanpuagrdominio()"
                (keypressLenseSearch)="onKeypressLenseSearch('onpuagrdominioChange')"
                (searched)="doSearchAction('puagrDominio')"></imes-lensesearch>
        </div>
        <div class="col-xs-12 col-sm-12 col-md-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
