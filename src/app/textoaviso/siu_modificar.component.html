<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="puthisTextoAviso" *ngIf="puthisTextoAviso.visible"
                (selected)="processputhistextoavisoSelected($event)" (cleared)="cleanputhistextoaviso()"
                (keypressLenseSearch)="onKeypressLenseSearch('onputhistextoavisoChange')"
                (searched)="doSearchAction('puthisTextoAviso')"></imes-lensesearch>
            <imes-input-string [field]="puDescripcion" *ngIf="puDescripcion.visible"></imes-input-string>
            <imes-input-string [field]="puValor" *ngIf="puValor.visible"></imes-input-string>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
