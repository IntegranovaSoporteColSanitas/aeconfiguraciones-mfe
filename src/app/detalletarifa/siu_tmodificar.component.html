<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="pProducto" *ngIf="pProducto.visible"
                (selected)="processpproductoSelected($event)" (cleared)="cleanpproducto()"
                (keypressLenseSearch)="onKeypressLenseSearch('onpproductoChange')"
                (searched)="doSearchAction('pProducto')"></imes-lensesearch>
            <imes-lensesearch [field]="pPlan" *ngIf="pPlan.visible"
                (selected)="processpplanSelected($event)" (cleared)="cleanpplan()"
                (keypressLenseSearch)="onKeypressLenseSearch('onpplanChange')"
                (searched)="doSearchAction('pPlan')"></imes-lensesearch>
            <imes-input-definedselection [field]="pTipoContrato" *ngIf="pTipoContrato.visible"></imes-input-definedselection>
            <imes-input-numeric [field]="pAnyo" *ngIf="pAnyo.visible"></imes-input-numeric>
            <imes-input-numeric [field]="pLimInferiorEdad" *ngIf="pLimInferiorEdad.visible"></imes-input-numeric>
            <imes-input-numeric [field]="pLimSuperiorEdad" *ngIf="pLimSuperiorEdad.visible"></imes-input-numeric>
            <imes-input-numeric [field]="pValor" *ngIf="pValor.visible"></imes-input-numeric>
            <imes-lense [field]="puthisDetalleTarifa" *ngIf="puthisDetalleTarifa.visible" (selected)="onputhisdetalletarifaChange()"
                (cleared)="cleanputhisdetalletarifa()" (searched)="doSearchAction('puthisDetalleTarifa')"></imes-lense>
        </div>
        <div class="col-xs-12 col-sm-12 col-md-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
