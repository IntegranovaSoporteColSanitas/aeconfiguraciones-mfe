<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="ptuputhisPlantillaReporte" *ngIf="ptuputhisPlantillaReporte.visible"
                (selected)="processptuputhisplantillareporteSelected($event)" (cleared)="cleanptuputhisplantillareporte()"
                (keypressLenseSearch)="onKeypressLenseSearch('onptuputhisplantillareporteChange')"
                (searched)="doSearchAction('ptuputhisPlantillaReporte')"></imes-lensesearch>
            <imes-input-string [field]="ptupuTitulo" *ngIf="ptupuTitulo.visible"></imes-input-string>
            <imes-input-date [field]="ptupuFechaVigencia" *ngIf="ptupuFechaVigencia.visible"></imes-input-date>
            <imes-input-string [field]="ptupuRutaArchivos" *ngIf="ptupuRutaArchivos.visible"></imes-input-string>
            <imes-input-string [field]="ptupuNombreArchivoPDF" *ngIf="ptupuNombreArchivoPDF.visible"></imes-input-string>
        </div>
        <div class="col-xs-12 col-sm-12 col-md-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
