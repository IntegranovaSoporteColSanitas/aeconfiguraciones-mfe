<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="ptupuagrDominio" *ngIf="ptupuagrDominio.visible"
                (selected)="processptupuagrdominioSelected($event)" (cleared)="cleanptupuagrdominio()"
                (keypressLenseSearch)="onKeypressLenseSearch('onptupuagrdominioChange')"
                (searched)="doSearchAction('ptupuagrDominio')"></imes-lensesearch>
            <imes-input-definedselection [field]="ptupuatrTramite" *ngIf="ptupuatrTramite.visible" (valueChanged)="onptupuatrtramiteChange()"></imes-input-definedselection>
            <imes-preload [field]="ptupuagrNovedad" *ngIf="ptupuagrNovedad.visible" (selected)="onptupuagrnovedadChange()"></imes-preload>
            <imes-preload [field]="ptupuagrCausal" *ngIf="ptupuagrCausal.visible"></imes-preload>
            <imes-input-numeric [field]="ptupuatrANSAreaMedica" *ngIf="ptupuatrANSAreaMedica.visible"></imes-input-numeric>
            <imes-input-numeric [field]="ptupuatrANSAfiliaciones" *ngIf="ptupuatrANSAfiliaciones.visible"></imes-input-numeric>
            <div class="card argumentGroup" *ngIf="isGroupVisible('6')">
                <div class="card-header">{{getGroupAlias('6')}}</div>
                <div class="card-body">
                    <imes-input-radio [field]="ptupuatrHabilLunes" *ngIf="ptupuatrHabilLunes.visible"></imes-input-radio>
                    <imes-input-radio [field]="ptupuatrHabilMartes" *ngIf="ptupuatrHabilMartes.visible"></imes-input-radio>
                    <imes-input-radio [field]="ptupuatrHabilMiercoles" *ngIf="ptupuatrHabilMiercoles.visible"></imes-input-radio>
                    <imes-input-radio [field]="ptupuatrHabilJueves" *ngIf="ptupuatrHabilJueves.visible"></imes-input-radio>
                    <imes-input-radio [field]="ptupuatrHabilViernes" *ngIf="ptupuatrHabilViernes.visible"></imes-input-radio>
                    <imes-input-radio [field]="ptupuatrHabilSabado" *ngIf="ptupuatrHabilSabado.visible"></imes-input-radio>
                    <imes-input-radio [field]="ptupuatrHabilDomingo" *ngIf="ptupuatrHabilDomingo.visible"></imes-input-radio>
                </div>
            </div>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
