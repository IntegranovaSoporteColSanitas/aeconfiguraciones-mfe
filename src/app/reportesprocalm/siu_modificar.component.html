<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="puthisReportesProcAlm" *ngIf="puthisReportesProcAlm.visible"
                (selected)="processputhisreportesprocalmSelected($event)" (cleared)="cleanputhisreportesprocalm()"
                (keypressLenseSearch)="onKeypressLenseSearch('onputhisreportesprocalmChange')"
                (searched)="doSearchAction('puthisReportesProcAlm')"></imes-lensesearch>
            <imes-input-string [field]="puDescripcion" *ngIf="puDescripcion.visible"></imes-input-string>
            <imes-input-string [field]="puNombreProc" *ngIf="puNombreProc.visible"></imes-input-string>
            <imes-input-string [field]="puNombreFichero" *ngIf="puNombreFichero.visible"></imes-input-string>
        </div>
        <div class="col-xs-12 col-sm-12 col-md-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
