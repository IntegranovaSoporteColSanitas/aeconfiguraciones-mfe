<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-preload [field]="puthisReportesProcAlm" *ngIf="puthisReportesProcAlm.visible" (selected)="reporteSeleccionado()"></imes-preload>
            <ng-container *ngFor="let field of listaParametros">
                <imes-input-numeric [field]="field" *ngIf="field.dataType == 'int'"></imes-input-numeric>
                <imes-input-string [field]="field" *ngIf="field.dataType == 'string'"></imes-input-string>
                    
            </ng-container>            
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
