<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="puthisSeccion" *ngIf="puthisSeccion.visible"
                (selected)="processputhisseccionSelected($event)" (cleared)="cleanputhisseccion()"
                (keypressLenseSearch)="onKeypressLenseSearch('onputhisseccionChange')"
                (searched)="doSearchAction('puthisSeccion')"></imes-lensesearch>
            <imes-input-string [field]="ptupuNombre" *ngIf="ptupuNombre.visible"></imes-input-string>
            <imes-input-numeric [field]="ptupuNumOrden" *ngIf="ptupuNumOrden.visible"></imes-input-numeric>
        </div>
        <div class="col-xs-12 col-sm-12 col-md-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
