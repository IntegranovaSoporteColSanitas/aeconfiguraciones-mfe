<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h3 class="title">{{getCompleteTitle()}}</h3>
        <div class="iiuRegion" [ngClass]="cssClasses">
            <imes-actionsnavigations [queryIU]="this"></imes-actionsnavigations>
            <!-- Display Set elements -->
            <div class="card displaySet">
                <div class="card-header">{{title}}</div>
                <div class="card-body">
                    <imes-input-numeric [field]="dseID" *ngIf="dseID.visible"></imes-input-numeric>
                    <imes-input-definedselection [field]="dseTipoServicio" *ngIf="dseTipoServicio.visible"></imes-input-definedselection>
                    <imes-input-string [field]="dseSolicitud" *ngIf="dseSolicitud.visible"></imes-input-string>
                    <imes-input-definedselection [field]="dseServicio" *ngIf="dseServicio.visible"></imes-input-definedselection>
                    <imes-input-string [field]="dseCapacidad" *ngIf="dseCapacidad.visible"></imes-input-string>
                    <imes-input-date [field]="dseFechaHora" *ngIf="dseFechaHora.visible"></imes-input-date>
                    <imes-input-string [field]="dseTextoError" *ngIf="dseTextoError.visible"></imes-input-string>
                    <imes-input-numeric [field]="dseTiempoEjecucion" *ngIf="dseTiempoEjecucion.visible"></imes-input-numeric>
                    <imes-input-string [field]="dsePeticion" *ngIf="dsePeticion.visible"></imes-input-string>
                    <imes-input-string [field]="dseRespuesta" *ngIf="dseRespuesta.visible"></imes-input-string>
                    <imes-input-string [field]="dseUsuario" *ngIf="dseUsuario.visible"></imes-input-string>
                </div>
            </div>
            <div *ngIf="showInstanceLog" class="iiuLogNavigation">
                <a (click)="onNavigateLoginstance()">{{langMng.translateText('app_INSTANCELOG', 'Log Instance')}}</a>
            </div>
        </div>
        <div class="col-12 iiuButtons">
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_CLOSE', '')}}</button>
        </div>
    </ng-container>
</form>
